<!DOCTYPE html>
<html lang="fa" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فیدااسکور و اعتماد | نظام‌نامهٔ فیدا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"></head><body>

<header class="page-hero"><div class="wrap">
  <div class="crumb">فیدا / <span class="en">FIDA Score</span></div>
  <h1>فیدااسکور و <span class="g">سرمایهٔ رفتاری</span></h1>
  <p class="lead" id="intro"></p>
</div></header>

<section class="sec"><div class="wrap">
  <div class="kicker">اجزای امتیاز</div>
  <h2>سیزده <span class="g">شاخصِ</span> اعتماد</h2>
  <div class="chips" id="components" style="margin-top:24px"></div>
</div></section>

<section class="sec" style="background:var(--space-2)"><div class="wrap">
  <div class="grid g2">
    <div class="card"><div class="ico">💠</div><h3>سرمایهٔ رفتاری <span class="en">Behavioral Capital</span></h3><p id="bc"></p></div>
    <div class="card"><div class="ico">♻️</div><h3>بازسازی اعتبار <span class="en">Rebuild</span></h3><p id="rebuild"></p></div>
  </div>
</div></section>

<section class="sec"><div class="wrap">
  <div class="kicker">نظام کارت‌ها</div>
  <h2>نُه <span class="g">کارتِ</span> اعتماد</h2>
  <p class="prose">«اعتماد خریدنی نیست؛ در طول زمان و بر پایهٔ رفتار ساخته می‌شود.» هر کارت یک وضعیت است — از خاکستری تا مشکی.</p>
  <div class="trust-strip" id="cards" style="margin-top:24px"></div>
</div></section>

<script src="assets/content.js"></script><script src="assets/common.js"></script>
<script>
mountChrome('trust.html');
document.getElementById('intro').textContent = FIDA.fidaScore.intro;
FIDA.fidaScore.components.forEach(c=>document.getElementById('components').appendChild(el('span','chip-lg',c)));
document.getElementById('bc').textContent = FIDA.fidaScore.behavioralCapital;
document.getElementById('rebuild').textContent = FIDA.fidaScore.rebuild;
FIDA.cards.forEach(c=>document.getElementById('cards').appendChild(
  el('div','tc',`<div class="band" style="background:${c.c}"></div><div class="tn">${c.name}</div><div class="te en">${c.en}</div><div class="td">${c.d}</div>`)));
</script></body></html>
