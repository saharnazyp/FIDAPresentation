<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فیدا | نظام‌نامهٔ جامع مادر — اکوسیستم اقتصادی اعتمادمحور</title>
<meta name="description" content="نظام‌نامهٔ جامع مادر فیدا: اکوسیستم اعتبارسنجی و توسعهٔ اقتصادیِ فرانگران — از اعتماد تا اثر قابل سنجش.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
#hero{height:100vh;min-height:660px;position:relative;display:flex;align-items:center;overflow:hidden}
#field3d{position:absolute;inset:0;z-index:1}
.hero-grad{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 90% at 50% 6%,transparent 42%,var(--space) 88%),linear-gradient(180deg,transparent 52%,var(--space) 100%)}
.hero-inner{position:relative;z-index:3;width:100%;text-align:center}
.hero-badge{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--gold-dim);border-radius:100px;padding:7px 18px;font-size:.82rem;color:var(--gold);margin-bottom:28px;background:rgba(233,198,107,.05)}
#hero h1{font-size:clamp(2.5rem,6.5vw,5rem);font-weight:900;line-height:1.14;letter-spacing:-1px;margin-bottom:22px}
#hero h1 .g{color:var(--gold)}
.hero-sub{font-size:clamp(1.05rem,2.1vw,1.35rem);color:var(--ink-dim);max-width:660px;margin:0 auto 32px}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.scroll-cue{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:3;color:var(--ink-dim);font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:8px}
.scroll-cue .l{width:1px;height:34px;background:linear-gradient(var(--gold),transparent);animation:drop 2s ease-in-out infinite}
@keyframes drop{0%{opacity:0;transform:scaleY(0);transform-origin:top}50%{opacity:1;transform:scaleY(1);transform-origin:top}100%{opacity:0;transform:scaleY(1);transform-origin:bottom}}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.3,1),transform .9s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.1s}.reveal.d2{transition-delay:.2s}.reveal.d3{transition-delay:.3s}

/* transform chain */
.chain-flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.chain-flow .node{background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:9px 18px;font-weight:600;font-size:.95rem}
.chain-flow .node.gold{border-color:var(--gold-dim);color:var(--gold)}
.chain-flow .arr{color:var(--gold-dim)}

/* explore section cards */
.explore{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-top:12px}
.xcard{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px;transition:transform .3s,border-color .3s,box-shadow .3s;position:relative;overflow:hidden}
.xcard::after{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at 80% 0%,var(--gold-soft),transparent 55%);opacity:0;transition:opacity .3s}
.xcard:hover::after{opacity:1}
.xcard:hover{transform:translateY(-5px);border-color:var(--gold-dim);box-shadow:0 24px 46px -24px rgba(0,0,0,.7)}
.xcard .xn{font-family:'Space Grotesk';color:var(--gold-dim);font-size:.82rem}
.xcard h3{font-size:1.18rem;margin:8px 0 9px}
.xcard p{color:var(--ink-dim);font-size:.92rem;margin-bottom:14px}
.xcard .go{color:var(--gold);font-size:.9rem;font-weight:600}

.axiom-strip{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
@media(max-width:760px){.axiom-strip{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="hero">
  <div id="field3d"></div>
  <div class="hero-grad"></div>
  <div class="hero-inner"><div class="wrap">
    <span class="hero-badge">نظام‌نامهٔ جامع مادر فیدا · <span class="en">MASTER CHARTER v3</span></span>
    <h1>اعتماد را به <span class="g">اثر</span><br>تبدیل می‌کنیم.</h1>
    <p class="hero-sub" id="hero-narrative"></p>
    <div class="hero-btns">
      <a class="btn-primary" href="identity.html">آغاز مطالعه</a>
      <a class="btn-ghost" href="#explore">کاوش صفحات</a>
    </div>
  </div></div>
  <div class="scroll-cue"><span>اسکرول کنید</span><span class="l"></span></div>
</section>

<!-- transform chain -->
<section class="sec" style="background:linear-gradient(180deg,var(--space),var(--space-2))">
  <div class="wrap">
    <div class="kicker reveal">روایت مادر</div>
    <p class="statement reveal d1" id="system-of"></p>
    <div class="chain-flow reveal d2" id="chain" style="margin-top:30px"></div>
  </div>
</section>

<!-- explore pages -->
<section class="sec" id="explore">
  <div class="wrap">
    <div class="kicker reveal">کاوش اکوسیستم</div>
    <h2 class="reveal d1">نظام‌نامه در <span class="g">هشت صفحه</span></h2>
    <div class="explore" id="explore-grid"></div>
  </div>
</section>

<!-- axioms -->
<section class="sec" style="background:var(--space-2)">
  <div class="wrap">
    <div class="kicker reveal">اصول محوری</div>
    <h2 class="reveal d1">احکامی که همه‌چیز بر آن‌ها استوار است</h2>
    <div class="axiom-strip" id="axiom-grid"></div>
  </div>
</section>

<script src="assets/content.js"></script>
<script src="assets/common.js"></script>
<script>
mountChrome('index.html');
enableReveal();
document.getElementById('hero-narrative').textContent = FIDA.narrative;
document.getElementById('system-of').innerHTML = FIDA.systemOf.replace('سیستم‌عاملِ','<span class="g">سیستم‌عاملِ</span>');

// chain
const chain = FIDA.transformChain.split('←').map(s=>s.trim());
const cf = document.getElementById('chain');
chain.forEach((n,i)=>{
  cf.appendChild(el('span','node'+(i===chain.length-1?' gold':''),n));
  if(i<chain.length-1) cf.appendChild(el('span','arr','←'));
});

// explore cards
const PAGES = [
  {n:'۰۱',href:'identity.html',t:'هویت و مأموریت',d:'تعریف رسمی، فلسفهٔ وجودی، مأموریت و چشم‌انداز فیدا.'},
  {n:'۰۲',href:'governance.html',t:'حکمرانی و ارکان',d:'هفده رکن حکمرانی، از هیئت مؤسس تا رصدخانهٔ فیدا.'},
  {n:'۰۳',href:'structure.html',t:'ساختار و زنجیره',d:'زنجیرهٔ رسمی: از عضو و تیم تا کنفدراسیون و فیدا مرکزی.'},
  {n:'۰۴',href:'trust.html',t:'فیدااسکور و اعتماد',d:'نظام اعتمادسنجی، سرمایهٔ رفتاری و بازسازی اعتبار.'},
  {n:'۰۵',href:'tools.html',t:'ابزارها',d:'فیدابریج، فیدامَچ، فیدااسکوپ، فیدارادار و گذرنامهٔ زنده.'},
  {n:'۰۶',href:'economy.html',t:'اقتصاد تیمی و فیرپلی',d:'زبان فوتبالی، پاس ارزش، گل سالم و منشور فیرپلی.'},
  {n:'۰۷',href:'trade.html',t:'تهاتر و تسویه',d:'فیدا ترید، میز کشور، اتاق تهاتر و اتاق تسویه.'},
  {n:'۰۸',href:'security.html',t:'محرمانگی و کارت‌ها',d:'اتاق امن، عدم دور زدن و نظام نُه کارتیِ اعتماد.'}
];
const eg = document.getElementById('explore-grid');
PAGES.forEach(p=>{
  eg.appendChild(el('a','xcard',
    `<div class="xn">${p.n}</div><h3>${p.t}</h3><p>${p.d}</p><span class="go">مطالعه →</span>`)).href = p.href;
});

// axioms
const axg = document.getElementById('axiom-grid');
FIDA.axioms.forEach(a=>axg.appendChild(el('div','axiom reveal',a)));
enableReveal();

// THREE.js hero — governance constellation
(function(){
  const mount=document.getElementById('field3d');
  if(!window.THREE){mount.style.background='radial-gradient(120% 100% at 50% 30%,#0a1220,#060a14)';return;}
  const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x060a14,0.05);
  const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);cam.position.set(0,2,20);
  const rend=new THREE.WebGLRenderer({antialias:true,alpha:true});rend.setPixelRatio(Math.min(devicePixelRatio,2));
  rend.setSize(innerWidth,innerHeight);mount.appendChild(rend.domElement);
  const N=110,R=15,pos=[],vel=[],geo=new THREE.BufferGeometry(),arr=new Float32Array(N*3);
  for(let i=0;i<N;i++){const x=(Math.random()-.5)*R*2,y=(Math.random()-.5)*R,z=(Math.random()-.5)*R*1.3;
    pos.push(new THREE.Vector3(x,y,z));vel.push(new THREE.Vector3((Math.random()-.5)*.008,(Math.random()-.5)*.006,(Math.random()-.5)*.008));
    arr[i*3]=x;arr[i*3+1]=y;arr[i*3+2]=z;}
  geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const points=new THREE.Points(geo,new THREE.PointsMaterial({color:0xe9c66b,size:0.14,transparent:true,opacity:.85}));scene.add(points);
  const lg=new THREE.BufferGeometry(),ML=N*7,la=new Float32Array(ML*6);lg.setAttribute('position',new THREE.BufferAttribute(la,3));
  const lines=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x1f9d6b,transparent:true,opacity:.22}));scene.add(lines);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(0.34,26,26),new THREE.MeshBasicMaterial({color:0xfff2cf}));scene.add(ball);
  const glow=new THREE.Mesh(new THREE.SphereGeometry(0.75,20,20),new THREE.MeshBasicMaterial({color:0xe9c66b,transparent:true,opacity:.2}));scene.add(glow);
  let bt=0,bf=0,bto=1;
  const grid=new THREE.GridHelper(44,30,0x123a2c,0x0d1a2c);grid.position.y=-8;grid.material.transparent=true;grid.material.opacity=.4;scene.add(grid);
  const mouse={x:0,y:0};addEventListener('mousemove',e=>{mouse.x=e.clientX/innerWidth-.5;mouse.y=e.clientY/innerHeight-.5});
  function frame(t){requestAnimationFrame(frame);
    const p=geo.attributes.position.array;
    for(let i=0;i<N;i++){pos[i].add(vel[i]);['x','y','z'].forEach((ax,ai)=>{const lim=ai===1?R*.5:R;if(pos[i][ax]>lim||pos[i][ax]<-lim)vel[i][ax]*=-1;});
      p[i*3]=pos[i].x;p[i*3+1]=pos[i].y;p[i*3+2]=pos[i].z;}
    geo.attributes.position.needsUpdate=true;
    let li=0;for(let i=0;i<N&&li<ML;i++)for(let j=i+1;j<N&&li<ML;j++){const dx=pos[i].x-pos[j].x,dy=pos[i].y-pos[j].y,dz=pos[i].z-pos[j].z;
      if(dx*dx+dy*dy+dz*dz<9){la[li*6]=pos[i].x;la[li*6+1]=pos[i].y;la[li*6+2]=pos[i].z;la[li*6+3]=pos[j].x;la[li*6+4]=pos[j].y;la[li*6+5]=pos[j].z;li++;}}
    for(let z=li*6;z<la.length;z++)la[z]=0;lg.attributes.position.needsUpdate=true;lg.setDrawRange(0,li*2);
    bt+=.011;if(bt>=1){bt=0;bf=bto;bto=Math.floor(Math.random()*N);}
    ball.position.lerpVectors(pos[bf],pos[bto],bt);ball.position.y+=Math.sin(bt*Math.PI)*1.6;glow.position.copy(ball.position);
    const s=1+Math.sin(t*.004)*.18;glow.scale.set(s,s,s);
    points.rotation.y+=.0006;lines.rotation.y=points.rotation.y;grid.rotation.z+=.0003;
    cam.position.x+=(mouse.x*3-cam.position.x)*.04;cam.position.y+=(2-mouse.y*2-cam.position.y)*.04;cam.lookAt(0,0,0);
    rend.render(scene,cam);}
  requestAnimationFrame(frame);
  addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rend.setSize(innerWidth,innerHeight)});
})();
</script>
</body>
</html>
